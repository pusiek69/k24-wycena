[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Node 20 skończył wsparcie w kwietniu 2026, a Vite 7 wymaga 20.19+/22.12+.
  # Trzymamy 22 (LTS) — jedna z możliwych przyczyn nieudanego builda odpada.
  NODE_VERSION = "22"


# Formularz „umów pomiar" wysyłany jest POST-em na „/" — Netlify Forms
# przechwytuje go zanim zadziała reguła przepisania poniżej.
# Powiadomienia na maila: panel Netlify → Forms → Form notifications.

# Strona żyje na domenie głównej kam24h.pl. Wersja z „www" przekierowuje
# na nią trwale (301), żeby Google widział jeden adres, a nie dwa takie same.
# Ta reguła musi być PRZED regułą łapiącą wszystko.
[[redirects]]
  from = "https://www.kam24h.pl/*"
  to = "https://kam24h.pl/:splat"
  status = 301
  force = true

# STARE DOMENY FIRMY — wszystkie prowadzą na kam24h.pl.
#
# k24h.pl i kamieniarstwo24h.pl (z „www" i bez) są podpięte w Netlify jako
# aliasy tego samego projektu. Bez tych reguł serwowałyby tę samą treść pod
# czterema adresami naraz — a to dla Google cztery kopie jednej strony.
#
# Przekierowanie jest 1:1 (`:splat`), więc stary link do konkretnej podstrony
# trafia dokładnie tam, gdzie powinien, a nie na stronę główną. To ma
# znaczenie dla linków, które gdzieś już krążą — w wizytówkach, na Facebooku
# i w podpisach zdjęć realizacji.
#
# `force = true` jest konieczne: bez tego Netlify najpierw znalazłby plik
# pasujący do ścieżki i oddał go zamiast przekierować.
#
# Kolejność ma znaczenie — te reguły muszą stać przed regułami ścieżkowymi.
#
# Reguły są WYŁĄCZNIE dla https://. Wersje http:// stały tu przez chwilę,
# ale nigdy się nie wykonywały: Netlify najpierw wymusza TLS na TYM SAMYM
# hoście (http://k24h.pl → https://k24h.pl), a dopiero potem sprawdza nasze
# reguły. Sprawdzone na prawdziwym ruchu po wystawieniu certyfikatów —
# wejście po http to zawsze dwa skoki i nie da się tego skrócić stąd.
# Oba skoki to 301 z zachowaniem ścieżki, więc SEO na tym nie traci.
[[redirects]]
  from = "https://k24h.pl/*"
  to = "https://kam24h.pl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.k24h.pl/*"
  to = "https://kam24h.pl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://kamieniarstwo24h.pl/*"
  to = "https://kam24h.pl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.kamieniarstwo24h.pl/*"
  to = "https://kam24h.pl/:splat"
  status = 301
  force = true

