# Nieznane adresy NIE są przepisywane na stronę główną. Wcześniej każdy
# literówkowy adres zwracał 200 z kreatorem, co Google liczy jako „miękki
# 404" i potrafi obniżyć ocenę całego serwisu. Teraz Netlify sam poda
# 404.html z prawidłowym kodem odpowiedzi.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    # CSP wpuszcza tylko to, czego naprawdę używamy: własne pliki + tagi
    # Google i Meta. Gdyby ktoś podmienił kod strony, przeglądarka zablokuje
    # wysyłkę danych w nieznane miejsce.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.interstone.pl https://www.googletagmanager.com https://pagead2.googlesyndication.com https://www.google-analytics.com https://www.google.com https://www.google.pl https://googleads.g.doubleclick.net https://www.facebook.com; connect-src 'self' https://*.workers.dev https://www.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.google-analytics.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://pagead2.googlesyndication.com https://www.google.com https://www.google.pl https://connect.facebook.net https://www.facebook.com; frame-src https://td.doubleclick.net https://www.googletagmanager.com; font-src 'self' data:; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Materiały promocyjne do wrzucania na social media. CORS jest tu potrzebny,
# bo film pobiera skrypt z innej domeny (kompozer Facebooka) — bez tego
# nagłówka fetch po stronie przeglądarki dostałby błąd CORS.
[[headers]]
  for = "/promo/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Zdjęcia realizacji. CORS jest tu potrzebny, bo Dawid wgrywa je na
# wizytówkę Google (Profil Firmy) przez przeglądarkę — kompozer na
# google.com pobiera plik fetchem z kam24h.pl, a bez tego nagłówka
# przeglądarka blokuje odczyt jako żądanie międzydomenowe.
#
# To wyłącznie publiczne zdjęcia galerii — te same, które każdy widzi
# na /realizacje. Nagłówek nie odsłania niczego, co nie byłoby już jawne:
# pozwala jedynie CUDZEMU skryptowi odczytać bajty pliku, który i tak
# jest dostępny pod publicznym adresem.
[[headers]]
  for = "/realizacje/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    # Zdjęcia galerii nie zmieniają się po wgraniu, a przy 172 plikach
    # brak cache oznacza tyle samo zapytań przy każdym wejściu w galerię.
    # Reguły `/*.webp` i `/*.png` wyżej łapią tylko katalog główny —
    # do podkatalogów nie sięgają, stąd osobny wpis. 30 dni, jak tam.
    Cache-Control = "public, max-age=2592000"
