# Nieznane adresy NIE są przepisywane na stronę główną. Wcześniej każdy
# literówkowy adres zwracał 200 z kreatorem, co Google liczy jako „miękki
# 404" i potrafi obniżyć ocenę całego serwisu. Teraz Netlify sam poda
# 404.html z prawidłowym kodem odpowiedzi.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    # CSP wpuszcza tylko to, czego naprawdę używamy: własne pliki + tagi
    # Google i Meta. Gdyby ktoś podmienił kod strony, przeglądarka zablokuje
    # wysyłkę danych w nieznane miejsce.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com https://www.google.com https://www.google.pl https://googleads.g.doubleclick.net https://www.facebook.com; connect-src 'self' https://*.workers.dev https://www.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.google-analytics.com https://connect.facebook.net https://www.facebook.com; frame-src https://td.doubleclick.net https://www.googletagmanager.com; font-src 'self' data:; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Materiały promocyjne do wrzucania na social media. CORS jest tu potrzebny,
# bo film pobiera skrypt z innej domeny (kompozer Facebooka) — bez tego
# nagłówka fetch po stronie przeglądarki dostałby błąd CORS.
[[headers]]
  for = "/promo/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
